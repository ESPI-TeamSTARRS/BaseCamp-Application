# Surcharge de DEVELOPPEMENT (WORK-86) : `payment` choisit le fournisseur Stripe, en mode TEST seulement.
# Elle n'est jamais utilisee par la CI ni par defaut : le fournisseur simule reste celui de la pile.
#
#   sh scripts/init-stripe-secrets.sh          # saisie masquee de la cle sk_test_... dans .secrets/payment/
#   sh scripts/init-stripe-secrets.sh --webhook  # secret de signature whsec_... (Stripe CLI : stripe listen)
#   COMPOSE_FILE=docker-compose.yml:docker-compose.stripe.yml docker compose up -d payment
#
# La cle est un FICHIER monte en secret Docker (/run/secrets/...), jamais une variable en clair. Une cle
# absente, illisible ou qui n'est pas `sk_test_...` empeche `payment` de demarrer, sans afficher la valeur.
# Session Checkout (WORK-88) : `payment` appelle api.stripe.com par le reseau sortant `payment-egress`, ajoute
# ICI seulement (jamais en production par defaut). Le fournisseur simule n'est jamais un repli.

services:
  payment:
    environment:
      APP_PAYMENT_PROVIDER: stripe
      APP_STRIPE_SECRET_KEY_FILE: /run/secrets/payment_stripe_secret_key
      APP_STRIPE_WEBHOOK_SECRET_FILE: /run/secrets/payment_stripe_webhook_secret
      APP_STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-http://localhost:8080/commande/{order_reference}/merci}
      APP_STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-http://localhost:8080/commande/{order_reference}/annulee}
    networks: [payment-egress]
    secrets: [payment_stripe_secret_key, payment_stripe_webhook_secret]

networks:
  payment-egress:
    driver: bridge

secrets:
  payment_stripe_secret_key:
    file: ${STRIPE_SECRET_KEY_FILE:-./.secrets/payment/stripe-secret-key}
  payment_stripe_webhook_secret:
    file: ${STRIPE_WEBHOOK_SECRET_FILE:-./.secrets/payment/stripe-webhook-secret}
